# Lift altyapisi — Docker Desktop'ta "lift" projesi olarak gorunur
# Kullanim: docker compose up -d
#
# lift
# ├── postgres
# ├── minio
# └── minio-init

name: lift

services:
  postgres:
    image: postgres:16-alpine
    container_name: lift-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lift
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d lift']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: lift-minio
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: lift-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'MinIO bekleniyor...';
        sleep 2;
      done;
      mc mb local/lift-uploads --ignore-existing;
      mc anonymous set none local/lift-uploads;
      echo 'Bucket hazir: lift-uploads';
      "

volumes:
  postgres_data:
  minio_data:
